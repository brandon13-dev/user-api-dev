spring:
  application:
    name: user-api

  datasource:
    url: jdbc:postgresql://localhost:5432/userdb
    username: devuser
    password: devpass123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080
  error:
    include-message: always

logging:
  level:
    com.devsolution: DEBUG
    org.springframework.web: INFO
