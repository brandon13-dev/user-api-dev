services:
  postgres:
    image: postgres:16-alpine
    container_name: user-api-db
    environment:
      - POSTGRES_DB=userdb
      - POSTGRES_USER=devuser
      - POSTGRES_PASSWORD=devpass123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser -d userdb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
